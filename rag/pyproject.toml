[project]
name = "rag-exemple"
version = "0.1.0"
description = "RAG d'exemple : il marche seul, et se branche sur l'évaluation par branchement_evaluation.py"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "typer>=0.12",
    "httpx>=0.27",
    "openai>=2",
    "pypdf>=7.1.1",
    "rank-bm25>=0.2.2",
    "numpy>=2.5.5",
    "langfuse>=5.2.0",
]

[project.scripts]
rag = "rag.commandes:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Le dossier rag/ est lui-même le paquet « rag » : on installe son dossier parent dans le chemin de Python.
[tool.hatch.build.targets.wheel]
only-include = ["__init__.py", "assistant.py", "branchement_evaluation.py", "commandes.py", "config.yaml", "pipeline"]
sources = {"" = "rag"}

[tool.hatch.build]
dev-mode-dirs = [".."]
