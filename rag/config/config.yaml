# Configuration du RAG d'exemple — volontairement minimal : le sujet du dépôt est l'évaluation.
# Aucune clé ici : elles sont lues dans .env.
# Changer de fournisseur = changer « adresse » et les noms de modèles, sans toucher au code.

nom: graphrag                       # la version évaluée s'appelle graphrag-<vectoriel|hybride>-k<k>-<empreinte>

# Les documents à indexer, et leur liste avec leurs métadonnées (référence, version, format, droits d'accès),
# telle que l'exporte la gestion documentaire.
documents: evaluation/corpus_exemple/sources
liste_des_documents: evaluation/corpus_exemple/sources/export_ged.csv
travail: sorties/rag                # cache d'extraction et index
sorties: sorties/sorties_rag        # sorties du contrat, une version du RAG par dossier

extraction:
  docling: http://127.0.0.1:5101    # analyse de mise en page et OCR (conteneur de infra/)

decoupage:
  taille_max: 1500                  # caractères ; une section plus longue est recoupée

# Point d'accès compatible OpenAI (ici LLM-Service, LiteLLM local)
modeles:
  adresse: http://127.0.0.1:8080/v1
  variable_cle: RAG_LLM_CLE
  generation:
    modele: gemma-4-e4b
    temperature: 0
    max_tokens: 4000                 # la réflexion du modèle compte dedans : 800 coupait les réponses longues
    sans_reflexion: false            # true : 9 fois plus rapide, mais 9 points d'exactitude en moins (guide 5)
    prix_entree_eur_par_million: 0   # coût des tokens ; 0 pour un modèle local
    prix_sortie_eur_par_million: 0
  embeddings:
    modele: embed

graphe:                             # étape 4, optionnelle : sans elle, le RAG est vectoriel ; avec, hybride
  actif: false                      # ou --graphe sur la ligne de commande
  ontologie: evaluation/corpus_exemple/ontologie/ontologie.ttl
  appels_paralleles: 4              # appels simultanés au modèle pendant l'extraction
  sans_reflexion: true              # chat_template_kwargs.enable_thinking = false (2 à 3 fois plus rapide)

recherche:
  k: 5                              # chunks donnés au modèle
  candidats: 30                     # chunks retenus par chaque recherche avant la fusion

langfuse:
  variable_adresse: LANGFUSE_BASE_URL
  variable_cle_publique: LANGFUSE_PUBLIC_KEY
  variable_cle_secrete: LANGFUSE_SECRET_KEY
