# Configuration du kit d'évaluation.
# Aucune clé ici : les clés sont lues dans .env, sous le nom de variable indiqué.
# Changer de fournisseur = changer « adresse » et « modele », sans toucher au code.

projet: maintenance-electrique

chemins:
  base: sqlite:///sorties/base.sqlite   # SQLAlchemy : postgresql+psycopg://… pour PostgreSQL
  sorties: sorties                      # corpus/, sorties_rag/, resultats/ sont créés dedans
  seuils: config/seuils.json

# Point d'accès compatible OpenAI (ici LLM-Service, LiteLLM local)
modeles:
  adresse: http://127.0.0.1:8080/v1
  variable_cle: KIT_LLM_CLE
  juge:
    modele: chat                 # qwen3.5-4b ; différent du modèle de génération du RAG (JUGE.md)
    temperature: 0
    version_prompt: "1.0"        # version du prompt de specs/JUGE.md
    sans_reflexion: true         # chat_template_kwargs.enable_thinking = false
    max_tokens: 2048
  embeddings:
    modele: embed                # bge-m3, utile aux scores Ragas qui en demandent

langfuse:
  variable_adresse: LANGFUSE_BASE_URL
  variable_cle_publique: LANGFUSE_PUBLIC_KEY
  variable_cle_secrete: LANGFUSE_SECRET_KEY

# Niveau 1 : seuils de ressemblance du rattachement (document 3, section 6)
rattachement:
  texte_approche: 0.95       # texte et fiche de base, si le chunk ne contient pas le passage
  tableau_mots: 0.90         # tableau : mêmes mots, dans n'importe quel ordre
  scanne_partiel: 0.90       # texte scanné : une partie du chunk ressemble au passage

# Niveau 3
reponse:
  seuil_non_fidele: 0.5      # fidélité Ragas sous ce seuil = réponse non fidèle (erreurs graves)

# Vérification du juge (JUGE.md)
verification_juge:
  taille_echantillon: 30
  accord_minimum: 0.9
