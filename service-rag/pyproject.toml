[project]
name = "rag-exemple"
version = "0.1.0"
description = "Service RAG d'exemple (commande rag) : il marche seul, et ouvre sa porte au service d'évaluation (src/rag/porte_evaluation/)"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "typer>=0.12",
    "httpx>=0.27",
    "openai>=2",
    "pypdf>=7.1.1",
    "rank-bm25>=0.2.2",
    "numpy>=2.5.5",
    "langfuse>=5.2.0",
    "rdflib>=7",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.scripts]
rag = "rag.commandes:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag"]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
