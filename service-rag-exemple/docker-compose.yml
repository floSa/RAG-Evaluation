# Le service RAG : le RAG d'exemple, ses endpoints d'évaluation ouverte à http://127.0.0.1:8100, et Docling
# (lecture des PDF, OCR des scans).
# Depuis service-rag-exemple/ : cp .env.example .env (y mettre la clé des modèles), puis docker compose up -d --build
# Une autre version du RAG : RAG_K=3 docker compose up -d   ou   RAG_GRAPHE=true docker compose up -d

name: service-rag

services:
  rag:
    build: .
    restart: unless-stopped
    network_mode: host               # joint les modèles, Docling et Langfuse là où ils écoutent : 127.0.0.1
    user: "${UID:-1000}:${GID:-1000}" # les fichiers de sorties/ restent à l'utilisateur
    env_file: .env
    environment:
      RAG_K: ${RAG_K:-}
      RAG_GRAPHE: ${RAG_GRAPHE:-}
    volumes:
      - ./sorties:/service/sorties   # l'index de chaque espace (production, evaluation), gardé entre deux lancements
      - ./corpus_documentaire:/service/corpus_documentaire:ro
      - ./config:/service/config:ro  # un réglage changé dans config.yaml vaut après « docker compose restart rag »
    depends_on: [docling]

  docling:
    image: quay.io/docling-project/docling-serve-cpu:v1.38.2
    restart: unless-stopped
    ports:
      - "127.0.0.1:5101:5001"
    environment:
      DOCLING_SERVE_ENABLE_UI: "false"
