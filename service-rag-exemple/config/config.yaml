# Configuration du RAG d'exemple — volontairement minimal : le sujet du dépôt est l'évaluation.
# Aucune clé ici : elles sont lues dans .env.
# Changer de fournisseur = changer « adresse » et les noms de modèles, sans toucher au code.

nom: rag-exemple                    # la version évaluée s'appelle rag-exemple-vectoriel-k<k>-<empreinte>

# Le corpus documentaire que le RAG sert à ses utilisateurs, et la liste des documents avec leurs métadonnées (référence, version, format, droits d'accès),
# telle que l'exporte la gestion documentaire. Vide dans le banc d'essai : le RAG n'a que les documents
# que le service d'évaluation lui envoie, par son endpoint « ingérer », rangés à part (sorties/evaluation/).
documents: corpus_documentaire
liste_des_documents: corpus_documentaire/liste_des_documents.csv
travail: sorties                    # un dossier par espace : sorties/production/, sorties/evaluation/

extraction:
  docling: http://127.0.0.1:5101    # analyse de mise en page et OCR (conteneur du docker-compose.yml)

decoupage:
  taille_max: 1500                  # caractères ; une section plus longue est recoupée

# Point d'accès compatible OpenAI (ici LLM-Service, LiteLLM local)
modeles:
  adresse: http://127.0.0.1:8080/v1
  variable_cle: RAG_LLM_CLE
  generation:
    modele: gemma-4-e4b
    temperature: 0
    max_tokens: 4000                 # la réflexion du modèle compte dedans : 800 coupait les réponses longues
    sans_reflexion: false            # true : 8 fois plus rapide, mais 8 points d'exactitude en moins (guide 5)
    prix_entree_eur_par_million: 0   # coût des tokens ; 0 pour un modèle local
    prix_sortie_eur_par_million: 0
  embeddings:
    modele: embed

endpoints_evaluation:                   # les endpoints ouverts au service d'évaluation (src/rag/endpoints_evaluation/)
  hote: 127.0.0.1
  port: 8100

recherche:
  k: 5                              # chunks donnés au modèle
  candidats: 30                     # chunks retenus par chaque recherche avant la fusion

langfuse:
  variable_adresse: LANGFUSE_BASE_URL
  variable_cle_publique: LANGFUSE_PUBLIC_KEY
  variable_cle_secrete: LANGFUSE_SECRET_KEY
