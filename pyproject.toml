# Le dépôt réunit deux paquets indépendants, installés ensemble par un seul « uv sync » :
#   rag/         le RAG d'exemple, commande « rag »   (il n'a besoin de rien de l'évaluation)
#   evaluation/  le kit d'évaluation, commande « kit » (il ne connaît aucun RAG)

[project]
name = "rag-evaluation"
version = "0.1.0"
description = "Évaluer un RAG de bout en bout : un corpus annoté, un kit d'évaluation, et un RAG d'exemple"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["rag-exemple", "kit-evaluation-rag"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["rag", "evaluation"]

[tool.uv.sources]
rag-exemple = { workspace = true }
kit-evaluation-rag = { workspace = true }

[dependency-groups]
dev = ["pytest>=8.0"]
fabrication = [           # seulement pour refabriquer le corpus d'exemple (evaluation/corpus_exemple/fabrication/)
    "pillow>=13.0.0",
    "pypdfium2>=5.15.2",
    "reportlab>=5.1.0",
]

[tool.pytest.ini_options]
testpaths = ["evaluation/tests", "rag/tests"]
