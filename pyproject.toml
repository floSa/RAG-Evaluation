[project]
name = "rag-evaluation"
version = "0.1.0"
description = "Bac à sable d'évaluation de RAG : le kit d'évaluation standard et un RAG de démonstration, séparés"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "sqlalchemy>=2.0",
    "typer>=0.12",
    "openpyxl>=3.1.5",
    "langfuse>=5.2.0",
    "jsonschema>=4.26.0",
]

[project.scripts]
kit = "kit.cli:app"
rag-demo = "rag_demo.cli:app"

[dependency-groups]
dev = ["pytest>=8.0"]
fabrication = [
    "pillow>=13.0.0",
    "pypdfium2>=5.15.2",
    "reportlab>=5.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kit", "rag_demo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
