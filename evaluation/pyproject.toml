[project]
name = "kit-evaluation-rag"
version = "0.1.0"
description = "Kit d'évaluation de RAG : corpus annoté, contrat, niveaux 1 à 4, rapport. Ne connaît aucun RAG."
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "sqlalchemy>=2.0",
    "typer>=0.12",
    "openpyxl>=3.1.5",
    "langfuse>=5.2.0",
    "jsonschema>=4.26.0",
    "openai>=2,<3",
    "rapidfuzz>=3.14.6",
    "jiwer>=4.0.0",
    "ragas>=0.4",
]

[project.scripts]
kit = "kit.commandes:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kit"]
